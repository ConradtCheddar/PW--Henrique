<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="conteiner">
        <div class="header">header</div>
        <div class="banner">banner</div>
        <div class="leftAside">leftAside</div>
        <div class="rightAside">rightAside</div>
        <div class="mainContent">mainContent</div>
        <div class="lowContent">lowContent</div>
        <div class="footer">footer</div>
    </div>
    
    <style>
        .conteiner{
            grid-template-columns: 150px 916px 150px ;
            grid-template-rows: 40px 80px 400px 100px 90px;
            grid-template-areas: 
            "header header header"
            "leftAside banner rightAside"
            "leftAside mainContent rightAside"
            "leftAside mainContent rightAside"
            "leftAside lowContent rightAside"
            "footer footer footer";

            gap: 5px;
        }
        .header{
            grid-area: header; 
            background-color: yellow; 
            text-align: center; 
            padding: 10px;
        }
        .banner{
            grid-area: banner; 
            background-color: red; 
            text-align: center; 
            padding: 10px;
        }
        .mainContent{
            grid-area: mainContent; 
            background-color: blue; 
            color: white; 
            text-align: center; 
            padding: 10px;
        }
        .lowContent{
            grid-area: lowContent; 
            background-color: green; 
            color: white; 
            text-align: center; 
            padding: 10px;
        }
        .rightAside{
            grid-area: rightAside; 
            background-color: orange; 
            text-align: center; 
            padding: 10px;
        }
        .leftAside{
            grid-area: leftAside; 
            background-color: green; 
            color: white; 
            text-align: center; 
            padding: 10px;
        }
        .footer{
            grid-area: footer; 
            background-color: navy; 
            color: white; 
            text-align: center; 
            padding: 10px;
        }
        @media screen and (max-width: 768px) {
            .conteiner{
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto 437px auto auto auto;
                grid-template-areas: 
                "header"
                "banner"
                "leftAside"
                "mainContent"
                "rightAside"
                "lowContent"
                "Footer";
            }
        }     
    </style>

    
</body>
</html>
