<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="body">
    <div class="conteiner">
        <div class="circulo" id="vermelho"></div>
        <div class="circulo" id="azul"></div>
        <div class="circulo" id="roxo"></div>
        <div class="circulo" id="verde"></div>
        <div class="circulo" id="amarelo"></div>
    </div>
    <style>
        .body:hover{
            transform: rotate(36000deg);
            transition: 1000s;
        }
        .conteiner{
           display: flex;
        }
        .circulo{
            border-radius: 50%;
            height: 100px;
            width: 100px;
        }
        #vermelho{
            position: fixed;
            top: 100;
            left: 100;
            background-color: red;
        }
        #azul{
            position: fixed;
            top: 100;
            right: 100;
            background-color: blue;
        }
        #roxo{
            position: fixed;
            top: 400;
            left: 850;
            background-color: purple;
        }
        #verde{
            position: fixed;
            bottom: 100;
            left: 100;
            background-color: green;
        }
        #amarelo{
            position: fixed;
            bottom: 100;
            right: 100;
            background-color: yellow;
        }

    </style>
    
</body>
</html>
