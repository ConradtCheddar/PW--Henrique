<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Números Primos</title>
</head>

<body>
    <div id="container">
        <h1>Informe os valores para verificar os primos</h1>
        <input type="number" id="inicio" placeholder="Mínimo">
        <input type="number" id="fim" placeholder="Máximo">
        <button id="btnVerificar" onclick="verificarPrimos()">Verificar</button>
        <div id="resultadoPrimos"></div>
    </div>

    <script>

        function ehPrimo(n) {
            if (n <= 1) {
                return false; 
            }

            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    return false; 
                }
            }
            return true; 
        }

        function verificarPrimos() {
            const min = parseInt(document.getElementById("inicio").value);
            const max = parseInt(document.getElementById("fim").value);
            const resultado = document.getElementById("resultadoPrimos");

            if (isNaN(min) || isNaN(max)) {
                resultado.textContent = "Por favor, insira ambos os valores.";
                return;
            }

            let primos = [];

            for (let i = min; i <= max; i++) {
                if (ehPrimo(i)) {
                    primos.push(i); 
                }
            }

            if (primos.length > 0) {
                resultado.textContent = "Números primos encontrados: " + primos.join(", ");
            } else {
                resultado.textContent = "Não foram encontrados números primos neste intervalo.";
            }
        }
    </script>
</body>

</html>
