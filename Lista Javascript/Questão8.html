<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Cor</title>
    
</head>

<body>
    <h1>Trocar Cor de Fundo</h1>
    <button id="btnMudaCor" onclick="trocarCor()">Trocar de cor</button>
    <div id="colorDisplay">Cor atual: rgb(255, 255, 255)</div>

    <script>
        function trocarCor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);

            const corAleatoria = `rgb(${r}, ${g}, ${b})`;

            document.body.style.backgroundColor = corAleatoria;

            const colorDisplay = document.getElementById('colorDisplay');
            colorDisplay.textContent = `Cor atual: ${corAleatoria}`;

            navigator.clipboard.writeText(corAleatoria).then(() => {
                console.log(`Cor ${corAleatoria} copiada para a área de transferência.`);
            });
        }
    </script>
</body>

</html>
