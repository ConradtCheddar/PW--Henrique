<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <style>
        body {
            margin: 0;
            background-color: #bdbdbd;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        .card {
            background-color: #fff;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .user {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .user:last-child {
            border-bottom: none;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-info strong {
            color: #333;
            font-size: 14px;
        }

        .user-info span {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="user">
            <img class="avatar" src="https://randomuser.me/api/portraits/women/1.jpg" alt="Linda Hart">
            <div class="user-info">
                <strong>Linda Hart</strong>
                <span>6765 Shady Ln Dr</span>
            </div>
        </div>
        <div class="user">
            <img class="avatar" src="https://randomuser.me/api/portraits/men/2.jpg" alt="Roger Medina">
            <div class="user-info">
                <strong>Roger Medina</strong>
                <span>2420 Paddock Way</span>
            </div>
        </div>
        <div class="user">
            <img class="avatar" src="https://randomuser.me/api/portraits/men/3.jpg" alt="Dean Sullivan">
            <div class="user-info">
                <strong>Dean Sullivan</strong>
                <span>6727 Airplane Ave</span>
            </div>
        </div>
        <div class="user">
            <img class="avatar" src="https://randomuser.me/api/portraits/women/4.jpg" alt="Elizabeth Austin">
            <div class="user-info">
                <strong>Elizabeth Austin</strong>
                <span>6685 Blossom Hill Rd</span>
            </div>
        </div>
    </div>

</body>
</html>
