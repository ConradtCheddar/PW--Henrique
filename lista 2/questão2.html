<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 300px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #999;
        }
        .input-field {
            width: 250px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .input-field2 {
            width: 100px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .circle {
            width: 50px;
            height: 50px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 20px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Company Logo</div>
    <input type="text" class="input-field">
    <input type="text" class="input-field">
    <input type="text" class="input-field">
    <input type="text" class="input-field">
    <input type="text" class="input-field">
    <div class="circle"></div>
    <input type="text" class="input-field2">

</div>

</body>
</html>
